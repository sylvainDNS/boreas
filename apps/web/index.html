<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boréas</title>
    <!-- PWA (#76) : le <link rel="manifest"> et la balise theme-color sont
         injectés au build par vite-plugin-pwa. Icônes Apple/favicon ajoutées ici
         (non gérées par le manifest webmanifest côté iOS/onglet). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Boréas" />
    <!-- Applique le thème avant le premier paint pour éviter un flash de thème
         (FOUC). La clé "boreas.theme" doit rester synchro avec src/lib/theme.ts. -->
    <script>
      try {
        const p = localStorage.getItem("boreas.theme");
        const dark =
          p === "dark" ||
          ((p === "system" || !p) &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
    <!-- Police Figtree via Google Fonts. En prod, servie first-party par Cloudflare
         Fonts (Speed → Optimization) — voir docs/adr/0013. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
